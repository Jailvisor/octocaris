[workspace]
resolver = "2"
exclude = ["spikes/win-webview2"]
members = [
    "crates/octos-protocol",
    "crates/octos-core",
    "crates/octos-storage",
    "crates/octos-webview",
    "crates/octos-win",
    "crates/octos-app",
    "xtask",
]
default-members = ["crates/octos-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"
authors = ["Octos Rust contributors"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
rfd = "0.17.2"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webview2-com = "0.39.1"
windows = { version = "0.62.2" }
windows-registry = "0.100"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "webp",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
