<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  :root {
    --drift-duration: 26s;
    --accent-color: #e5484d;
  }
  body {
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: #120f1c;
  }
  .field {
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(40% 45% at 22% 30%, rgba(255, 96, 96, 0.75), transparent 70%),
      radial-gradient(38% 42% at 78% 26%, rgba(105, 122, 255, 0.65), transparent 70%),
      radial-gradient(50% 45% at 55% 80%, rgba(46, 196, 150, 0.36), transparent 70%),
      linear-gradient(125deg, #1a1024, #2b1330 45%, #101b30);
    filter: saturate(1.15);
    animation: drift var(--drift-duration) ease-in-out infinite alternate;
  }
  .grain {
    position: absolute;
    inset: 0;
    opacity: 0.16;
    background-image: radial-gradient(rgba(255,255,255,0.5) 0.6px, transparent 0.6px);
    background-size: 4px 4px;
    mix-blend-mode: overlay;
  }
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(5, 4, 10, 0.55) 100%);
  }
  .clock {
    position: absolute;
    left: 7vw;
    bottom: 7vh;
    display: flex;
    align-items: flex-end;
    gap: 1.1rem;
    text-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  .time {
    font-size: clamp(64px, 8vw, 148px);
    font-weight: 250;
    letter-spacing: -0.06em;
    line-height: 0.85;
    font-variant-numeric: tabular-nums;
  }
  .date {
    padding-bottom: 0.7rem;
    color: rgba(255, 255, 255, 0.68);
    font-size: clamp(11px, 1.1vw, 18px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .pill {
    position: absolute;
    right: 4vw;
    bottom: 5vh;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    background: rgba(10, 10, 16, 0.36);
    backdrop-filter: blur(18px);
    color: rgba(255, 255, 255, 0.78);
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .pill button {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 6px 12px;
    background: var(--accent-color); color: #fff;
    color: #15101c;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: transform 120ms ease, background 140ms ease;
  }
  .pill button:hover { background: #fff; }
  .pill button:active { transform: translateY(1px); }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #54d891;
    box-shadow: 0 0 12px rgba(84, 216, 145, 0.9);
  }
  @keyframes drift {
    0% { transform: translate3d(-2%, -1%, 0) scale(1.02) rotate(-1deg); }
    50% { transform: translate3d(2%, 2%, 0) scale(1.08) rotate(1.5deg); }
    100% { transform: translate3d(-1%, 1%, 0) scale(1.04) rotate(-0.5deg); }
  }
</style>
</head>
<body>
  <div class="field"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
  </div>

  <div class="pill">
    <span class="dot"></span>
    <span>Octos gradient · M2</span>
    <button id="ping">Click me</button>
  </div>

<script>
  let clicks = 0;
  const time = document.getElementById('time');
  const date = document.getElementById('date');
  const ping = document.getElementById('ping');

  function tick() {
    const now = new Date();
    time.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    date.textContent = now.toLocaleDateString([], {
      weekday: 'long', month: 'long', day: 'numeric'
    });
    requestAnimationFrame(tick);
  }
  tick();

  document.addEventListener('click', (event) => {
    window.chrome?.webview?.postMessage({
      type: 'click',
      x: event.clientX,
      y: event.clientY,
      target: event.target?.id || event.target?.tagName || 'unknown'
    });
  });

  ping.addEventListener('click', () => {
    clicks += 1;
    ping.textContent = `Clicked ${clicks}`;
    window.chrome?.webview?.postMessage({
      type: 'ping',
      source: 'gradient',
      count: clicks,
      at: Date.now()
    });
  });
</script>
</body>
</html>
